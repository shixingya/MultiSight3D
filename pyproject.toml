[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "multisight3d"
version = "0.1.0"
description = "Open-source multi-view photogrammetry pipeline: reconstruct a textured 3D mesh from photos. 开源多视图摄影测量管线，通过物体多角度照片重建带纹理三维网格模型。"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Xingya Shi" }]
keywords = ["photogrammetry", "sfm", "mvs", "3d-reconstruction", "mesh", "glb"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
  "pillow>=10.0",
  "numpy>=1.24",
]

[project.optional-dependencies]
server = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
]

[project.scripts]
multisight = "multisight.cli:main"

[project.urls]
Homepage = "https://github.com/shixingya/MultiSight3D"
Issues = "https://github.com/shixingya/MultiSight3D/issues"

[tool.hatch.build.targets.wheel]
packages = ["multisight"]

[tool.pytest.ini_options]
testpaths = ["tests"]
